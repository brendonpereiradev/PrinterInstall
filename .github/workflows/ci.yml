name: Build and tests

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore PrinterInstall.sln
      - name: Build
        run: dotnet build PrinterInstall.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test PrinterInstall.sln --configuration Release --no-build --verbosity normal
