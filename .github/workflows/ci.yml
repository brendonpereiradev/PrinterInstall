name: Build and tests

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore PrinterInstall.sln
      - name: Build
        run: dotnet build PrinterInstall.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test PrinterInstall.sln --configuration Release --no-build --verbosity normal
