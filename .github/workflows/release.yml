name: Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify public source and history
        env:
          REQUESTED_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        shell: pwsh
        run: |
          if ($env:REQUESTED_RELEASE_TAG) {
            [xml]$project = Get-Content 'src/PrinterInstall.App/PrinterInstall.App.csproj'
            $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
            if ($env:REQUESTED_RELEASE_TAG -ne "v$version") {
              throw 'A tag solicitada deve corresponder à versão do aplicativo.'
            }
          }
          python scripts/Test-PublicData.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Test-PublicData.py --history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-Secrets.ps1

      - name: Restore dependencies
        run: dotnet restore PrinterInstall.sln

      - name: Run automated tests
        run: dotnet test PrinterInstall.sln --configuration Release --no-restore --verbosity normal

      - name: Build and package single-file executable
        shell: powershell
        run: |
          .\scripts\Publish-PrinterInstall.ps1 -Configuration Release

      - name: Verify published executable
        shell: powershell
        run: |
          $exePath = "publish\PrinterInstall\Printer Install.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "O executável '$exePath' não foi encontrado após o build."
            exit 1
          }
          $size = (Get-Item $exePath).Length / 1MB
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          Write-Host "Executável gerado com sucesso: $exePath"
          Write-Host "Tamanho: $([math]::Round($size, 2)) MB"
          Write-Host "SHA256: $hash"
          "$hash  Printer Install.exe" | Out-File -FilePath "publish\PrinterInstall\checksums-sha256.txt" -Encoding utf8

      - name: Check executable before upload
        shell: pwsh
        run: |
          python scripts/Test-PublicData.py --artifact 'publish/PrinterInstall/Printer Install.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-Secrets.ps1 -ArtifactPath 'publish/PrinterInstall'

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            publish/PrinterInstall/Printer Install.exe
            publish/PrinterInstall/checksums-sha256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
