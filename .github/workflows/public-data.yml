name: Public data checks

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Check public source and history
        shell: pwsh
        run: |
          python scripts/Test-PublicData.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Test-PublicData.py --history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check secrets
        shell: pwsh
        run: ./scripts/Test-Secrets.ps1
